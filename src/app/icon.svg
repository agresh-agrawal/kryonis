<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KRYONIS">
  <!--
    The mark is the game: a crater seen from above, with the colony at its
    centre. A ring for the rim, a lighter disc for the floor, a bronze dot for
    the landing site, and the sweep of the sun across it.

    Drawn rather than exported, because the project ships no binary art and a
    favicon that is 900 bytes of vector reads sharply at 16px and at 512px.
  -->
  <defs>
    <radialGradient id="floor" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#8a5a38" />
      <stop offset="70%" stop-color="#5d3a26" />
      <stop offset="100%" stop-color="#3a241a" />
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c98a52" />
      <stop offset="100%" stop-color="#6d4630" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#12100e" />

  <!-- Crater wall, then the floor it encloses. -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#rim)" stroke-width="3.5" />
  <circle cx="32" cy="32" r="19.5" fill="url(#floor)" />

  <!-- Terraces on the inner wall. -->
  <circle cx="32" cy="32" r="15.5" fill="none" stroke="#8a5a38" stroke-width="0.9" opacity="0.5" />

  <!-- The colony: a lander and two habitat domes. -->
  <circle cx="32" cy="31" r="3.6" fill="#e8e2d9" />
  <circle cx="32" cy="31" r="1.6" fill="#c98a52" />
  <circle cx="24" cy="37" r="2.1" fill="#cfc8bd" />
  <circle cx="40" cy="37" r="2.1" fill="#cfc8bd" />

  <!-- Connecting ways. -->
  <path d="M26 35.5 L30 32.5 M38 35.5 L34 32.5" stroke="#9a8b7c" stroke-width="1.1" stroke-linecap="round" />

  <!-- Sun sweep across the rim. -->
  <path d="M13 22 A23 23 0 0 1 51 22" fill="none" stroke="#e8b98a" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />
</svg>
